name: Bug report
description: Report something that is not working in FleetMind.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FleetMind version
      placeholder: "0.10.4"
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Observe ...
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets before posting.

