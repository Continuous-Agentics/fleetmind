name: Documentation
description: Report missing, stale, or confusing docs.
title: "docs: "
labels: ["documentation"]
body:
  - type: textarea
    id: docs_gap
    attributes:
      label: Documentation gap
      description: What is missing or wrong?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: "README.md, docs/COMPATIBILITY.md, ..."

