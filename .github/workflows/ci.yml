name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify published tarball contents (npm pack --dry-run)
        run: |
          # Verify that the published tarball does NOT include src/, test files,
          # infra/, or docs/ — only dist/, README.md, and LICENSE.
          PACK_OUTPUT=$(npm pack --dry-run 2>&1)
          echo "$PACK_OUTPUT"

          # Extract the file list lines (lines that look like paths in the tarball)
          FILES=$(echo "$PACK_OUTPUT" | grep -E '^\s+[a-zA-Z]' | awk '{print $NF}' || true)
          echo "Files that would be published:"
          echo "$FILES"

          FAIL=0
          while IFS= read -r f; do
            case "$f" in
              src/*|test/*|infra/*|docs/*|*.test.ts|*.test.js|*.spec.ts|*.spec.js)
                echo "ERROR: unexpected file in tarball: $f"
                FAIL=1
                ;;
            esac
          done <<< "$FILES"

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "package.json 'files' field includes paths that should not be published."
            echo "Update the 'files' array in package.json to exclude them."
            exit 1
          fi
          echo "Tarball contents look clean."

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform init + validate (root module)
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform init + validate (modules/task-ledger)
        working-directory: infra/terraform/modules/task-ledger
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck on infra/scripts
        run: |
          shopt -s nullglob
          FILES=(infra/scripts/*.sh)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No .sh files found in infra/scripts/ — skipping."
            exit 0
          fi
          shellcheck "${FILES[@]}"
