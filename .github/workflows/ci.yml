name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'openclaw/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - 'README.md'
      - 'LICENSE'
      - 'docs/WHERE.md'
      - 'docs/protocol.md'
      - 'docs/integration/delegation.md'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'openclaw/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - 'README.md'
      - 'LICENSE'
      - 'docs/WHERE.md'
      - 'docs/protocol.md'
      - 'docs/integration/delegation.md'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify published tarball contents (npm pack --dry-run)
        run: |
          # Verify the published tarball contents. Allowed:
          #   - dist/**, openclaw/**, README.md, LICENSE, package.json
          #   - docs/*.md (top-level public docs)
          #   - docs/integration/delegation.md (only this integration doc ships)
          # Denied: src/, test/, infra/, internal docs subdirs (audits/, design/, test/).
          PACK_OUTPUT=$(npm pack --dry-run 2>&1)
          echo "$PACK_OUTPUT"

          # `npm pack --dry-run` prints one line per file as:
          #   npm notice <size>  <path>
          # Lines starting at column 0 ("npm notice ..."), not indented.
          FILES=$(echo "$PACK_OUTPUT" \
            | grep -E '^npm notice [0-9]+(\.[0-9]+)?[kKmMgG]?B[[:space:]]+\S+' \
            | awk '{print $NF}' || true)

          echo "Files that would be published:"
          echo "$FILES"

          if [ -z "$FILES" ]; then
            echo "ERROR: could not parse any files from 'npm pack --dry-run' output."
            echo "The npm output format may have changed — update this guard."
            exit 1
          fi

          FAIL=0
          while IFS= read -r f; do
            case "$f" in
              src/*|test/*|infra/*|*.test.ts|*.test.js|*.spec.ts|*.spec.js)
                echo "ERROR: unexpected source/test/infra file in tarball: $f"
                FAIL=1
                ;;
              docs/audits/*|docs/design/*|docs/test/*)
                echo "ERROR: internal docs subdir in tarball: $f"
                FAIL=1
                ;;
              docs/integration/*)
                # Only delegation.md is allowed to ship from integration/.
                if [ "$f" != "docs/integration/delegation.md" ]; then
                  echo "ERROR: unexpected docs/integration/ file in tarball: $f"
                  FAIL=1
                fi
                ;;
            esac
          done <<< "$FILES"

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "package.json 'files' field includes paths that should not be published."
            echo "Update the 'files' array in package.json to exclude them."
            exit 1
          fi
          echo "Tarball contents look clean."

          # Positive assertion: the surviving CLI-side docs MUST ship.
          # Operator-facing docs (QUICKSTART, SETUP-A-FLEET, MULTI-FLEET,
          # OPERATING, TROUBLESHOOTING, GITHUB-APPS, CONCEPTS) now live in
          # the fleetmind-template repo and are no longer expected here.
          for required in docs/WHERE.md docs/protocol.md docs/integration/delegation.md; do
            if ! echo "$FILES" | grep -qx "$required"; then
              echo "ERROR: required doc missing from tarball: $required"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi

      - name: Smoke test installable tarball
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          npm pack --pack-destination "$TMPDIR"
          mkdir -p "$TMPDIR/install"
          cd "$TMPDIR/install"
          npm init -y >/dev/null
          npm install "$TMPDIR"/*.tgz
          ./node_modules/.bin/fleetmind --version

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck on infra/scripts
        run: |
          shopt -s nullglob
          FILES=(infra/scripts/*.sh)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No .sh files found in infra/scripts/ — skipping."
            exit 0
          fi
          shellcheck "${FILES[@]}"
