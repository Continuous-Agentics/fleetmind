name: Publish to npm

# Fires when Grace publishes a GitHub Release created from a tag, and can also
# be dispatched manually against an existing tag. A Release created or published
# by the default GITHUB_TOKEN does not emit release:published, so the manual
# publish step is the intentional human gate.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish (e.g. v0.10.4)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor == 'ggettert'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Resolve publish mode and verify version
        id: release
        shell: bash
        env:
          TARGET_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${TARGET_TAG}"
          RAW_VERSION="${TAG#v}"
          NPM_TAG="latest"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$RAW_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Tag/version mismatch: tag=$TAG package.json=$PACKAGE_VERSION"
            exit 1
          fi

          if [[ "$RAW_VERSION" =~ -(alpha|beta|rc)(\.|$) ]]; then
            NPM_TAG="beta"
          fi

          echo "npm_tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test installable tarball
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          npm pack --pack-destination "$TMPDIR"
          mkdir -p "$TMPDIR/install"
          cd "$TMPDIR/install"
          npm init -y >/dev/null
          npm install "$TMPDIR"/*.tgz
          ./node_modules/.bin/fleetmind --version

      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          npm publish --access public --tag "${{ steps.release.outputs.npm_tag }}" --provenance
