# publish.yml — Release-on-tag publish to GitHub Packages.
#
# Triggers:
#   - push of any tag matching `vMAJOR.MINOR.PATCH` (strict semver)
#   - manual `workflow_dispatch` from the GitHub Actions UI for reruns/debug
#
# Strict semver regex on the tag prevents typo'd tags (e.g. `v0.5.2.` or
# `v0.5-prefix`) from triggering an accidental publish.
#
# After a successful publish, the workflow also creates a GitHub Release for
# the same tag with release notes extracted from CHANGELOG.md.

name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'publish' to confirm manual republish (push-tag flow runs automatically)"
        required: true
        default: ""

jobs:
  publish-to-github-packages:
    name: Publish
    runs-on: ubuntu-latest
    # Auto-run on tag push. For manual workflow_dispatch reruns, require the
    # 'confirm' input (defence in depth — a manual rerun should be deliberate).
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish')

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout (full history for tag context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@continuous-agentics"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Auto-create GitHub Release with CHANGELOG-extracted notes ────────
      # Skipped on workflow_dispatch reruns (the release usually already
      # exists for the tag).
      - name: Extract release notes from CHANGELOG
        if: github.event_name == 'push'
        id: changelog
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Extract the section between `## [VERSION]` and the next `## [` header.
          # Trims leading/trailing blank lines.
          NOTES=$(awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^$/{$d;N;ba' -e '}')
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG entry found for [${VERSION}]; release will use auto-generated notes"
            NOTES="(No CHANGELOG entry found for ${VERSION}. See commit history for changes.)"
          fi
          # Multi-line output for actions
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
