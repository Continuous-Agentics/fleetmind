# publish.yml — Release-on-tag publish to npm.
#
# Triggers:
#   - push of a STABLE tag `vMAJOR.MINOR.PATCH` → published to the `latest`
#     dist-tag (the default `npm i` target). Release marked as a full release.
#   - push of a PRERELEASE tag `vMAJOR.MINOR.PATCH-<suffix>` (e.g.
#     `v0.8.0-beta.0`) → published to the `beta` dist-tag, so `npm i` does NOT
#     pick it up; opt in with `npm i @continuous-agentics/fleetmind@beta` or, on
#     a host, `fleetmind self-upgrade --to 0.8.0-beta.0`. Release marked as a
#     prerelease. This is the "beta while testing" path.
#   - manual `workflow_dispatch` from the GitHub Actions UI for reruns/debug.
#
# Both tag patterns are anchored on strict MAJOR.MINOR.PATCH so typo'd tags
# (e.g. `v0.5.2.` or `v0.5-prefix`) don't trigger an accidental publish; the
# prerelease pattern additionally requires a `-<suffix>`.
#
# After a successful publish, the workflow also creates a GitHub Release for
# the same tag with release notes extracted from CHANGELOG.md.

name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # stable      → latest
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # prerelease  → beta
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'publish' to confirm manual republish (push-tag flow runs automatically)"
        required: true
        default: ""

jobs:
  publish-to-npm:
    name: Publish
    runs-on: ubuntu-latest
    # Auto-run on tag push. For manual workflow_dispatch reruns, require the
    # 'confirm' input (defence in depth — a manual rerun should be deliberate).
    if: >-
      github.actor == 'ggettert' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish')
      )

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout (full history for tag context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test installable tarball
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          npm pack --pack-destination "$TMPDIR"
          mkdir -p "$TMPDIR/install"
          cd "$TMPDIR/install"
          npm init -y >/dev/null
          npm install "$TMPDIR"/*.tgz
          ./node_modules/.bin/fleetmind --version

      # Route prerelease tags (v1.2.3-beta.0) to the `beta` dist-tag and stable
      # tags to `latest`. On manual workflow_dispatch (ref is a branch, not a
      # tag) default to `latest` — preserves the prior manual-rerun behavior.
      - name: Determine dist-tag
        id: disttag
        run: |
          set -euo pipefail
          REF="${GITHUB_REF}"
          TAG="${REF#refs/tags/}"
          if [[ "$REF" == refs/tags/* && "$TAG" == *-* ]]; then
            echo "npm_tag=beta"   >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest"   >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          npm publish --access public --tag "${{ steps.disttag.outputs.npm_tag }}" --provenance

      # ── Auto-create GitHub Release with CHANGELOG-extracted notes ────────
      # Skipped on workflow_dispatch reruns (the release usually already
      # exists for the tag).
      - name: Extract release notes from CHANGELOG
        if: github.event_name == 'push'
        id: changelog
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Extract the section between `## [VERSION]` and the next `## [` header.
          # Trims leading/trailing blank lines.
          NOTES=$(awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^$/{$d;N;ba' -e '}')
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG entry found for [${VERSION}]; release will use auto-generated notes"
            NOTES="(No CHANGELOG entry found for ${VERSION}. See commit history for changes.)"
          fi
          # Multi-line output for actions
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          prerelease: ${{ steps.disttag.outputs.prerelease }}
