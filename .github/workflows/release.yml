name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'ggettert' || github.actor == 'wren-on-ca[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Create the Release as a draft. Publishing it manually as Grace is the
      # deliberate gate that emits release:published and fans out to npm publish.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
