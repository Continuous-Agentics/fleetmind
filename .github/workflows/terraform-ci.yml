name: Terraform CI

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "docs/terraform/**"
      - ".github/workflows/terraform-ci.yml"
      - ".github/CODEOWNERS"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "docs/terraform/**"
      - ".github/workflows/terraform-ci.yml"
      - ".github/CODEOWNERS"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: fmt-validate-lint-security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        run: terraform test

      - name: Validate examples
        run: |
          set -euo pipefail
          for dir in examples/*; do
            [ -d "$dir" ] || continue
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      - name: Terraform docs check
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: infra/terraform
          config-file: .terraform-docs.yml
          git-push: "false"

      - name: Terraform docs check (basic example)
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: infra/terraform/examples/basic
          config-file: ../../.terraform-docs.yml
          output-file: ../../../../docs/terraform/examples/basic.md
          output-method: inject
          git-push: "false"

      - name: Terraform docs check (existing VPC example)
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: infra/terraform/examples/existing-vpc
          config-file: ../../.terraform-docs.yml
          output-file: ../../../../docs/terraform/examples/existing-vpc.md
          output-method: inject
          git-push: "false"

      - name: Verify generated Terraform docs are current
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- docs/terraform/README.md docs/terraform/examples/

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint init
        run: tflint --init

      - name: TFLint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl"

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          skip-dirs: ".terraform"
          hide-progress: true
