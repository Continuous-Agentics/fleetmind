services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fleetmind
      POSTGRES_PASSWORD: fleetmind
      POSTGRES_DB: fleetmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Orchestrator (Conductor 🎼) ─────────────────────────────────────────────
  orchestrator:
    image: ghcr.io/openclaw/openclaw:latest
    environment:
      OPENCLAW_STATE_DIR: /state
      DATABASE_URL: postgresql://fleetmind:fleetmind@postgres:5432/fleetmind
      SLACK_BOT_TOKEN: ${ORCHESTRATOR_SLACK_TOKEN}
      SLACK_SIGNING_SECRET: ${ORCHESTRATOR_SLACK_SIGNING_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ../openclaw/orchestrator:/state
    ports:
      - "18789:18789"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["openclaw", "gateway", "--port", "18789"]

  # ── Frontend Bot (Pixel 🎨) ─────────────────────────────────────────────────
  frontend-bot:
    image: ghcr.io/openclaw/openclaw:latest
    environment:
      OPENCLAW_STATE_DIR: /state
      DATABASE_URL: postgresql://fleetmind:fleetmind@postgres:5432/fleetmind
      SLACK_BOT_TOKEN: ${FRONTEND_BOT_SLACK_TOKEN}
      SLACK_SIGNING_SECRET: ${FRONTEND_BOT_SLACK_SIGNING_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ../openclaw/frontend-bot:/state
    ports:
      - "18790:18789"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["openclaw", "gateway", "--port", "18789"]

  # ── API Bot (Forge ⚙️) ──────────────────────────────────────────────────────
  api-bot:
    image: ghcr.io/openclaw/openclaw:latest
    environment:
      OPENCLAW_STATE_DIR: /state
      DATABASE_URL: postgresql://fleetmind:fleetmind@postgres:5432/fleetmind
      SLACK_BOT_TOKEN: ${API_BOT_SLACK_TOKEN}
      SLACK_SIGNING_SECRET: ${API_BOT_SLACK_SIGNING_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ../openclaw/api-bot:/state
    ports:
      - "18791:18789"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["openclaw", "gateway", "--port", "18789"]

volumes:
  postgres_data:
