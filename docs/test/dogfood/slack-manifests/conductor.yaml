display_information:
  name: Conductor
  description: PM bot — dogfood test fleet
  background_color: "#2C3E50"
  long_description: |
    Conductor is the project-manager bot for Grace's dogfood test fleet (Continuous-Agentics/fleetmind). It receives tasks from humans, delegates work to specialty worker bots (Forge), tracks tasks in a DynamoDB ledger, and closes the loop on every delegation. Runs on dedicated EC2 in AWS account 624905204775 (us-west-2).
features:
  bot_user:
    display_name: Conductor
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - chat:write.public
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - reactions:read
      - reactions:write
      - users:read
      - files:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
