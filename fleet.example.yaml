# fleet.example.yaml — FleetMind fleet definition
#
# Copy this to fleet.yaml and fill in your values.
# Add fleet.yaml to .gitignore — it contains secret references.
# Commit fleet.example.yaml instead.
#
# Deploy with: fleetmind deploy fleet.yaml
#
# Infrastructure note: each agent in this fleet gets its OWN runtime host
# ("one host per agent, one gateway per host"). Where an agent runs and how its
# service is managed is declared under `targets:` below; the agent references a
# target by id. AWS hosts use the aws-ssm provider; Mac minis / bare metal use
# the ssh provider. Persistent state belongs in the shared substrates
# (task-ledger DDB, context-store DDB, narratives S3).
# To override EC2 instance sizing for specific agents, pass per-agent maps in
# fleet.derived.tfvars or a custom .tfvars file:
#
#   agent_instance_types = { conductor = "t3.large", forge = "t3.medium" }
#
# Defaults (var.instance_type = t3.medium) apply for any agent not listed.

# ── Metadata ──────────────────────────────────────────────────────────────────
fleet:
  name: acme-fleet
  version: "1.0.0"
  client: Acme Corp
  description: "Engineering and support bots for Acme Corp"

# ── Skills Repo (client GitOps source) ────────────────────────────────────────
# The client's own skills repo — contains company-specific skill customizations
# seeded from Continuous Agentics base skills during onboarding.
# FleetMind watches this repo and auto-pushes updates to agent workspaces.
skills_repo:
  url: https://github.com/acme-corp/acme-skills   # client's private repo
  branch: main
  poll_interval: 60s        # How often `fleetmind watch` polls for changes
  # tag: v1.2.0             # Pin entire fleet to a tag (overrides branch)
  # local: ./skills         # Use local skills dir instead (dev mode)

# ── Private Registry (Continuous Agentics proprietary skills) ─────────────────
# Required only if any agent uses source: private skills.
# Set CA_REGISTRY_TOKEN via: fleetmind secrets set CA_REGISTRY_TOKEN <token>
private_registry:
  url: https://npm.pkg.github.com     # GitHub Packages (or your Verdaccio URL)
  token_env: CA_REGISTRY_TOKEN        # Env var holding the auth token
  scope: "@continuous-agentics"       # npm scope for CA private packages

# ── Secrets ───────────────────────────────────────────────────────────────────
# Secrets are never stored here. Use ${ENV_VAR} references.
# Run: fleetmind secrets set KEY value  (stores in local encrypted store)
# Or:  export KEY=value before deploying
secrets:
  provider: env             # env | aws-ssm | vault

# ── Delegation (optional) ───────────────────────────────────────────────────────────────────────
# Enables the PM-bot → worker-bot task ledger. PM-vs-worker is determined by
# the agent's existing `orchestrator: true` flag (PM bots set it; workers don't).
# Per-agent delegation routing config goes in each agent's `delegation:` block
# (worker_bots for PMs, specialty for workers). See docs/protocol.md and
# docs/integration/delegation.md.
#
# Substrate provisioned by infra/terraform/modules/task-ledger/.
# Wake-pipeline targeting (SSM session key, EC2 tag) is configured at the
# Terraform layer, not in fleet.yaml.
#
# Omit this block (or set enabled: false) for fleets without delegation.
delegation:
  enabled: true
  aws_region: us-west-2                       # required when enabled (no silent default)
  table_name: acme-fleet-tasks                # DDB table name (TF module: name_prefix + 'tasks')
  s3_bucket: acme-fleet-ledger                # S3 bucket  (TF module: name_prefix + 'ledger')
  # s3_key_template: "v0/projects/{project}/tasks/{date}-{task_id}.md"  # default; override only if needed
  # nats: {}                                  # NATS transport; auto-defaulted when enabled — uncomment only to override
  #                                           # (e.g. nats: { subject_prefix: "myfleet", creds_file: "..." })

# ── Targets (runtime hosts) ───────────────────────────────────────────────────
# Where each agent runs, how to reach it, and how to (re)start its gateway.
# Agents reference a target by id below. The `provider` discriminates the host
# type and selects the per-host block:
#   aws-ssm → EC2 reached via SSM (requires `aws.region`)
#   ssh     → Mac mini / bare metal / VMware guest (requires `ssh.host`, `ssh.user`)
#   local   → the operator machine (dev)
targets:
  conductor-host:
    provider: aws-ssm
    os: linux
    service_manager: systemd
    workspace_base: /home/openclaw/.openclaw/workspace
    aws:
      region: us-west-2
      # runtime_user: openclaw  # default; use ec2-user only for legacy hosts
  pixel-host:
    provider: aws-ssm
    os: linux
    service_manager: systemd
    workspace_base: /home/openclaw/.openclaw/workspace
    aws:
      region: us-west-2
      # runtime_user: openclaw  # default; use ec2-user only for legacy hosts
  forge-host:
    provider: aws-ssm
    os: linux
    service_manager: systemd
    workspace_base: /home/openclaw/.openclaw/workspace
    aws:
      region: us-west-2
      # runtime_user: openclaw  # default; use ec2-user only for legacy hosts
  # Example of a non-AWS host (e.g. a Mac mini) — uncomment and point an agent at it:
  # mac-lab-1:
  #   provider: ssh
  #   os: macos
  #   service_manager: launchd
  #   workspace_base: /Users/openclaw/.openclaw
  #   ssh:
  #     host: mac-lab-1.local
  #     user: openclaw

# ── Deploy (artifact transport) ───────────────────────────────────────────────
# Where rendered agent bundles are published before a target applies them.
# Optional — if omitted, deploys fall back to the <fleet-name>-ledger S3 bucket.
deploy:
  artifact_store:
    provider: s3
    s3:
      bucket: acme-fleet-ledger
      region: us-west-2

# ── Agents ────────────────────────────────────────────────────────────────────
# FleetMind is provider-neutral: `model` is a "provider/model" string and
# OpenClaw makes the actual call. To use a different provider, just change the
# model prefix (e.g. openai/gpt-4o, google/gemini-2.0-flash) — `fleetmind
# secrets populate` then stages that provider's API key. Key resolution per
# provider P: ${<AGENT>_<P>_API_KEY} → agent.api_keys[P] → ${<P>_API_KEY}.
agents:
  defaults:
    model: anthropic/claude-sonnet-4-6
    # Optional ordered failover chain OpenClaw tries when `model` fails. Applies
    # to every agent unless that agent sets its own `fallback_models` (use [] to
    # opt an agent out / make it strict). Each entry is a "provider/model" string.
    # fallback_models:
    #   - openai/gpt-4o
    #   - google/gemini-2.0-flash
    plugins:
      - anthropic

  list:
    - id: conductor
      name: Conductor
      emoji: 🎼
      description: "Orchestrator. Routes requests to specialist agents."
      orchestrator: true
      target: conductor-host
      # REQUIRED: every model provider this agent needs an API key for.
      # One Secrets Manager secret is created per (agent, provider) at
      # <fleet>/agents/<id>/providers/<provider>. List every provider the
      # agent uses (primary model + any fallback_models). Inference from
      # the `model:` string was removed; this list must be explicit.
      providers:
        - anthropic
      # Optional: point specific providers at specific credentials. Omit to use
      # the ${ANTHROPIC_API_KEY} / ${OPENAI_API_KEY} env-var convention.
      # api_keys:
      #   anthropic: ${ANTHROPIC_API_KEY}
      #   openai: ${ACME_OPENAI_KEY}
      persona:
        soul: |
          You are Conductor, an orchestrating AI that coordinates a fleet of specialists.
          When a request comes in, figure out which specialist(s) should handle it,
          delegate via sessions_send, and synthesize the result for the user.
          Be decisive. Be brief. Let your specialists do the deep work.
      channels:
        - provider: slack
          account_id: conductor
          bot_token: ${CONDUCTOR_BOT_TOKEN}
          app_token: ${CONDUCTOR_APP_TOKEN}
      skills:
        # Tier 1: ClaWHub public skill
        - name: taskflow
          source: clawhub
          author: continuous-agentics
        # Tier 2: Continuous Agentics proprietary skill (requires CA_REGISTRY_TOKEN)
        - name: ca-fleet-ops
          source: private
          version: "1.0.0"
        # Tier 4: FleetMind bundled first-party skills
        # These ship inside the fleetmind package at openclaw/skills/<name>/ and
        # do NOT require a skills_repo entry. Use source: fleetmind for the
        # PM-side bot-delegation skill and the worker-side bot-reception skill.
        # If the name is wrong, fleetmind deploy errors explicitly (no silent skip).
        - name: bot-delegation
          source: fleetmind
      plugins:
        - anthropic
        - brave
      agent_to_agent:
        can_send_to: [pixel, forge]
      # PM-bot delegation config: list the worker agent IDs this PM can delegate to.
      # `orchestrator: true` above is what marks this agent as a PM in the schema.
      # The close-the-loop path is NATS-push: worker subscribers publish
      # `task.shipped` / `task.blocked`, which wakes this PM on the delegation
      # thread. No polling sweep is needed (and the `sweeps` field was removed
      # in fleetmind 0.8.0-beta.8).
      delegation:
        worker_bots: [pixel, forge]

    - id: pixel
      name: Pixel
      emoji: 🎨
      description: "Frontend specialist. React, design systems, UX, browser."
      orchestrator: false
      target: pixel-host
      providers:
        - anthropic
      persona:
        soul: |
          You are Pixel, a frontend engineering specialist.
          You handle React, CSS, design systems, and UX questions.
          When Conductor delegates to you, reply directly in the Slack thread
          using your own identity. Be precise and show your work.
      channels:
        - provider: slack
          account_id: pixel
          bot_token: ${PIXEL_BOT_TOKEN}
          app_token: ${PIXEL_APP_TOKEN}
      skills:
        # Tier 1: ClaWHub public skills
        - name: github
          source: clawhub
          author: steipete
          version: "1.0.0"           # Pinned; omit for latest
        # Tier 3: Client's own skill (from skills_repo — default source)
        - name: acme-frontend-standards
          source: client
        - name: acme-design-tokens
          source: client
        # Tier 4: FleetMind bundled skill for worker-side task reception
        - name: bot-reception
          source: fleetmind
      plugins:
        - anthropic
      agent_to_agent:
        can_send_to: [conductor]
      # Worker-bot delegation config: specialty label PMs use for routing decisions.
      delegation:
        specialty: frontend

    - id: forge
      name: Forge
      emoji: ⚙️
      description: "Backend specialist. APIs, databases, infrastructure."
      orchestrator: false
      target: forge-host
      providers:
        - anthropic
      persona:
        soul: |
          You are Forge, a backend engineering specialist.
          You handle APIs, databases, cloud infra, and system design.
          Be direct and technical. Show commands and configs when relevant.
      channels:
        - provider: slack
          account_id: forge
          bot_token: ${FORGE_BOT_TOKEN}
          app_token: ${FORGE_APP_TOKEN}
      skills:
        # Tier 1: ClaWHub public skills
        - name: github
          source: clawhub
          author: steipete
        # Tier 2: Continuous Agentics proprietary skill
        - name: ca-incident-triage
          source: private
        # Tier 3: Client's own runbook layer (extends ca-incident-triage)
        - name: acme-incident-runbook
          source: client
      plugins:
        - anthropic
        - brave
      agent_to_agent:
        can_send_to: [conductor]
      delegation:
        specialty: backend

# ── Outputs ───────────────────────────────────────────────────────────────────
outputs:
  openclaw_json: ./rendered/openclaw.json       # Generated OpenClaw config
  terraform_vars: ./rendered/fleet.derived.tfvars  # Consumed by openclaw-terraform
  workspace_manifests: ./rendered/workspaces/   # Per-agent workspace files

# ── Fleet-wide OpenClaw settings ──────────────────────────────────────────────
openclaw:
  gateway:
    port: 18789
    mode: local
    bind: loopback
  session:
    dm_scope: per-channel-peer
  tools:
    profile: coding
    web_search:
      enabled: true
      provider: brave
  slack:
    mode: socket
    typing_reaction: thinking_face
    ack_reaction: eyes
    allow_bots: true
    history_limit: 111
    streaming:
      mode: partial
      native_transport: true
    reply_to_mode_by_chat_type:
      channel: all
