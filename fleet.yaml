# fleet.yaml — minimal viable test fleet for gg-sandbox (251714435910)
# 1 PM (Conductor) + 1 worker (Forge, backend specialty)

fleet:
  name: gg-sandbox
  version: "1.0.0"
  client: ""
  description: "Test fleet on gg-sandbox — validate fleetmind end-to-end"

skills_repo:
  local: ./openclaw            # use bundled fleetmind role templates + skills

secrets:
  provider: env

delegation:
  enabled: true
  aws_region: us-west-2
  table_name: gg-sandbox-tasks
  s3_bucket: gg-sandbox-narratives-251714435910   # MUST be globally unique; add 6-char suffix
  nats:
    servers:
      - nats://REPLACE_ME:4222  # set to your NATS server URL (Cloud Map DNS or IP)

agents:
  defaults:
    model: anthropic/claude-haiku-4-5
    workspace_base: /opt/openclaw/workspace
    plugins:
      - anthropic

  list:
    - id: conductor
      name: Conductor
      emoji: 🎼
      role: pm
      description: "PM bot — gg-sandbox test fleet"
      orchestrator: true
      model: anthropic/claude-sonnet-4-6   # PM gets a bit more horsepower
      persona:
        soul: |
          You are Conductor, the project-manager bot for the gg-sandbox test fleet.
          You delegate tasks to worker bots via the bot-delegation skill and close
          the loop on every assignment.
      slack:
        account_id: conductor
        bot_user_id: "U0B34DGUL1G"          # Conductor's Slack bot user_id (captured via auth.test)
        channels: ["C0B2NNJEFKR", "C0B324RF1QW"]  # PM home + delegation channel
        bot_token: "${CONDUCTOR_BOT_TOKEN}"
        app_token: "${CONDUCTOR_APP_TOKEN}"
        background_color: "#2C3E50"        # Slack App manifest display colour
        long_description: >
          Conductor is the project-manager bot for Grace's gg-sandbox test fleet (Continuous-Agentics/fleetmind).
          It receives tasks from humans, delegates work to specialty worker bots (Forge), tracks tasks in a
          DynamoDB ledger, and closes the loop on every delegation. Runs on dedicated EC2 in AWS account
          251714435910 (us-west-2).
      skills:
        - name: bot-delegation
          source: fleetmind
      agent_to_agent:
        can_send_to: [forge]
      delegation:
        worker_bots: [forge]
        sweeps:
          - name: conductor-sweep-forge
            worker_id: forge
            every: 5m
            model: anthropic/claude-haiku-4-5

    - id: forge
      name: Forge
      emoji: ⚙️
      role: backend-worker
      description: "Backend worker — gg-sandbox test fleet"
      orchestrator: false
      persona:
        soul: |
          You are Forge, a backend worker bot. You accept delegated tasks
          from Conductor (the PM bot) and ship them.
      slack:
        account_id: forge
        # TODO: run `fleetmind secrets auth-test --agent forge` (or equivalent) to capture
        # Forge's bot user_id from Slack auth.test, then fill in bot_user_id below.
        # bot_user_id: "U_FORGE"
        channels: ["C0B324RF1QW"]          # delegation channel only
        bot_token: "${FORGE_BOT_TOKEN}"
        app_token: "${FORGE_APP_TOKEN}"
        background_color: "#8B4513"        # Slack App manifest display colour (role default)
        long_description: >
          Forge is the backend specialty worker bot for Grace's gg-sandbox test fleet
          (Continuous-Agentics/fleetmind). It receives task envelopes from Conductor (the PM bot),
          acknowledges with :eyes:, ships work back through a DynamoDB task ledger, and posts completion
          summaries. Runs on dedicated EC2 in AWS account 251714435910 (us-west-2).
      skills:
        - name: bot-reception
          source: fleetmind
      agent_to_agent:
        can_send_to: [conductor]
      delegation:
        specialty: backend

outputs:
  openclaw_json: ./rendered/openclaw.json
  # Write directly into the Terraform directory so `*.derived.tfvars` is picked up
  # by `terraform apply` automatically. This file is auto-loaded; operators
  # don't need to pass it explicitly via -var-file.
  terraform_vars: ./infra/terraform/fleet.derived.tfvars

openclaw:
  gateway:
    port: 18789
    mode: local
    bind: loopback
  session:
    dm_scope: per-channel-peer
  tools:
    profile: coding
    web_search:
      enabled: false
      # brave plugin is buggy; using duckduckgo (key-free, bundled)
      provider: duckduckgo
  slack:
    mode: socket
    typing_reaction: thinking_face
    ack_reaction: eyes
    allow_bots: true
    history_limit: 50
    streaming:
      mode: partial
      native_transport: true
    reply_to_mode_by_chat_type:
      channel: all
