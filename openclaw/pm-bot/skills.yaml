# Skill manifest for the pm-bot template.
#
# Read by `fleetmind doctor` (validation — errors if any agent with
# role: pm is missing a required skill) and `fleetmind sync-template
# pm-bot` (scaffolds these entries into a fleet.yaml agent block).
#
# The manifest is policy data: doctor reports missing active requirements,
# while render --check validates and normal render appends them. Conditions
# are evaluated against fleet.yaml before either command computes gaps.

role: pm

required:
  # Delegation protocol — PM side
  - name: bot-delegation
    source: fleetmind
    when: delegation-enabled
  # Worker self-start protocol — inbound handler (CON-91)
  - name: worker-self-start
    source: fleetmind
    when: delegation-enabled

  # Universal bundled skills (every bot type gets these once built).
  # Commented out until the corresponding SKILL.md ships in
  # openclaw/skills/. Uncomment each entry as the skill lands.
  # - name: fleet-context
  #   source: fleetmind
  # - name: task-ledger-query
  #   source: fleetmind
  # - name: bot-self-update
  #   source: fleetmind
  # - name: agent-status
  #   source: fleetmind
