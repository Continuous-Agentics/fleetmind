# GitHub App permission manifest for the worker-bot template.
#
# Read by `fleetmind github-app create` to set the default permission scope
# for any agent declared with `role: worker`. Per-agent overrides in
# fleet.yaml's `agents.<agent>.github_app` block take precedence on a
# per-key basis.
#
# Generic workers do the full code-contribution cycle: pull contents, push
# changes, open PRs, comment on issues, trigger Actions, observe checks.

role: worker

permissions:
  contents: write
  pull_requests: write
  issues: write
  actions: write
  checks: read
  metadata: read

events: []
