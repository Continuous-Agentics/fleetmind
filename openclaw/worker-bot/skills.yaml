# Skill manifest for the worker-bot template.
#
# Read by `fleetmind doctor` and `fleetmind sync-template worker-bot`.
# See openclaw/pm-bot/skills.yaml for the manifest format details.

role: worker

required:
  # Delegation protocol — worker side
  - name: bot-reception
    source: fleetmind

  # Universal bundled skills (not yet built — see openclaw/pm-bot/skills.yaml note)
